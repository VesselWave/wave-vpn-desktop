[package]
name = "wave-vpn"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Independent AirVPN client, reimplemented from Eddie references"

# Stay standalone even when copied below an older parent Cargo workspace.
[workspace]

[features]
default = ["desktop"]
desktop = ["dep:iced", "dep:png", "dep:ksni", "dep:resvg"]

[lib]
name = "wave_protocol"

[[bin]]
name = "wave-vpn"
path = "src/main.rs"

[[bin]]
name = "wave-vpn-gui"
path = "src/gui.rs"
required-features = ["desktop"]

[dependencies]
aes = "0.8"
libc = "0.2"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "svg"], optional = true }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
roxmltree = "0.20"
rpassword = "7"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
png = { version = "0.17", optional = true }
resvg = { version = "0.45.1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"], optional = true }
nix = { version = "0.29", features = ["signal", "user"] }
fs2 = "0.4"
signal-hook = "0.3"
