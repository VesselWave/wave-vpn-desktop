[package]
name = "wave-vpn"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Independent AirVPN client, reimplemented from Eddie references"

[features]
default = ["desktop"]
desktop = ["dep:iced"]

[lib]
name = "wave_protocol"

[[bin]]
name = "wave-vpn"
path = "src/main.rs"

[[bin]]
name = "wave-vpn-gui"
path = "src/gui.rs"
required-features = ["desktop"]

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "svg"], optional = true }
nix = { version = "0.29", features = ["signal", "user"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
roxmltree = "0.20"
rpassword = "7"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
