name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'lab/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'lab/**', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # Debug binaries for the Linux checks below; tests have already built most of them.
      - run: cargo build --locked --bins
      # The optimized build runs on main only; tagged releases build it again in release-build.yml.
      - if: github.ref == 'refs/heads/main'
        run: cargo build --release --locked --bins
      - if: runner.os == 'Linux'
        name: Install namespace dependencies and validate networking
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools iproute2 nftables curl dbus systemd-resolved
          sudo python3 tests/linux_network.py target/debug/wave-vpn
      - if: runner.os == 'Linux'
        name: Verify release signatures and tamper rejection
        run: python3 scripts/test-release.py
      - if: runner.os == 'Linux'
        name: Stage install and uninstall, from the checkout and from a tarball layout
        run: |
          stage=$(mktemp -d)
          DESTDIR="$stage" bash scripts/install.sh install "$PWD/target/debug"
          test -x "$stage/usr/local/bin/wave-vpn"
          test -x "$stage/usr/local/bin/wave-vpn-uninstall"
          DESTDIR="$stage" bash scripts/install.sh uninstall
          test ! -e "$stage/usr/local/bin/wave-vpn"
          bundle=$(mktemp -d)
          DESTDIR="$bundle/files" bash scripts/install.sh install "$PWD/target/debug"
          cp scripts/install.sh "$bundle/install.sh"
          DESTDIR="$stage" bash "$bundle/install.sh" install
          cmp "$bundle/files/usr/local/bin/wave-vpn" "$stage/usr/local/bin/wave-vpn"
          test -f "$stage/usr/local/share/doc/wave-vpn/docs/USER-GUIDE.md"
          DESTDIR="$stage" bash "$stage/usr/local/bin/wave-vpn-uninstall"
          test -z "$(find "$stage" -type f)"
      - if: runner.os == 'Linux'
        name: Build .deb, .rpm and Arch packages
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          NFPM="$RUNNER_TEMP/nfpm" bash scripts/package.sh "$RUNNER_TEMP/packages" target/debug
          dpkg-deb --info "$RUNNER_TEMP"/packages/*.deb
          dpkg-deb --contents "$RUNNER_TEMP"/packages/*.deb | grep -q ' ./usr/bin/wave-vpn-gui$'
