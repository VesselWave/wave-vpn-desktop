name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'lab/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'lab/**', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # Debug binaries for the Linux checks below; tests have already built most of them.
      - run: cargo build --locked --bins
      # The optimized build runs on main only; tagged releases build it again in release-build.yml.
      - if: github.ref == 'refs/heads/main'
        run: cargo build --release --locked --bins
      - if: runner.os == 'Linux'
        name: Install namespace dependencies and validate networking
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools iproute2 nftables curl dbus systemd-resolved
          sudo python3 tests/linux_network.py target/debug/wave-vpn
      - if: runner.os == 'Linux'
        name: Verify release signatures and tamper rejection
        run: python3 scripts/test-release.py
      - if: runner.os == 'Linux'
        name: Stage install and uninstall
        run: |
          stage=$(mktemp -d)
          DESTDIR="$stage" bash scripts/install.sh install "$PWD/target/debug"
          test -x "$stage/usr/local/bin/wave-vpn"
          DESTDIR="$stage" bash scripts/install.sh uninstall
          test ! -e "$stage/usr/local/bin/wave-vpn"
