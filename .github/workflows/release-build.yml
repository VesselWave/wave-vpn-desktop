name: Release
# Pushing a tag vX.Y.Z builds, signs, verifies and publishes the GitHub release.
# The signing secrets live in the protected "release" environment.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  SIGN_KEY: 414018C0BBB8C0A70A80BF570AA32CCB2C0B3951
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Match tag to app version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version"
          test -f "docs/RELEASE-v$version.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Install nFPM for .deb, .rpm and Arch packages
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          echo "NFPM=$RUNNER_TEMP/nfpm" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          GPG_KEY_BASE64: ${{ secrets.RELEASE_GPG_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${GPG_KEY_BASE64:?Missing RELEASE_GPG_KEY_BASE64}"
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$GPG_KEY_BASE64" | base64 --decode | gpg --batch --quiet --import
          printf 'batch\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
            echo "passphrase-file $GNUPGHOME/passphrase" >> "$GNUPGHOME/gpg.conf"
          fi
          gpg --list-secret-keys "$SIGN_KEY" > /dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Check, build, sign and verify
        run: bash scripts/release.sh --sign-key "$SIGN_KEY"
      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$VERSION" in 0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag "${flags[@]}" \
            --title "Wave VPN $VERSION for Linux" \
            --notes-file "docs/RELEASE-v$VERSION.md" \
            target/distribution/*
