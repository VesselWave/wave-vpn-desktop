name: Build tagged prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a version tag
        run: test "$(git describe --tags --exact-match HEAD)" = "v$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -1)"
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Build tagged source and binary archives
        run: bash scripts/release.sh
      - name: Upload unsigned archives for local manifest signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-candidate
          path: target/distribution/*
          if-no-files-found: error
          retention-days: 7
