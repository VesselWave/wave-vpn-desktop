minimumLimaVersion: 2.2.0
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed
vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 40GiB
video:
  display: vz
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      # Plymouth's kernel hook needs fontconfig configured before kernel updates.
      apt-get install -y fontconfig
      apt-get install -y linux-image-arm64 task-xfce-desktop lightdm git fish tmux vim kitty \
        build-essential pkg-config libssl-dev libfontconfig1-dev libxkbcommon-dev \
        libwayland-dev mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri \
        wireguard-tools nftables iproute2 polkitd pkexec libsecret-tools gnome-keyring
      # Prefer the graphics-capable distro kernel over the cloud-only kernel.
      generic_kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-arm64' ! -name '*-cloud-*' | sort -V | tail -n 1)
      test -n "$generic_kernel"
      printf 'GRUB_TOP_LEVEL="%s"\n' "$generic_kernel" > /etc/default/grub.d/99-wave-lab.cfg
      update-grub
      systemctl enable lightdm
      systemctl set-default graphical.target
      mkdir -p /etc/lightdm/lightdm.conf.d
      printf '[Seat:*]\nautologin-user={{.User}}\nautologin-session=xfce\n' > /etc/lightdm/lightdm.conf.d/50-wave-lab.conf
      install -d -m 700 -o '{{.User}}' '{{.Home}}/.config' '{{.Home}}/.config/wave-lab'
      set +x
      if [ ! -f '{{.Home}}/.config/wave-lab/login-password' ]; then
        openssl rand -base64 24 > '{{.Home}}/.config/wave-lab/login-password'
        chmod 600 '{{.Home}}/.config/wave-lab/login-password'
        chown '{{.User}}' '{{.Home}}/.config/wave-lab/login-password'
        printf '%s:%s\n' '{{.User}}' "$(cat '{{.Home}}/.config/wave-lab/login-password')" | chpasswd
      fi
      systemctl start graphical.target
  - mode: user
    script: |
      #!/bin/bash
      set -euxo pipefail
      mkdir -p "$HOME/repos"
      if [ ! -d "$HOME/repos/dotfiles/.git" ]; then
        git clone https://github.com/VesselWave/dotfiles.git "$HOME/repos/dotfiles"
        git -C "$HOME/repos/dotfiles" checkout c4ba9e941e40347bc3d640e65bb29bdd415a2dbc
      fi
      cd "$HOME/repos/dotfiles"
      ./scripts/link fish tmux vim kitty
probes:
  - mode: readiness
    description: Xfce packages and dotfiles are installed
    script: |
      #!/bin/bash
      set -eu
      test "$(dpkg-query -W -f='${Status}' xfce4-session)" = 'install ok installed'
      test -L "$HOME/.vimrc"
