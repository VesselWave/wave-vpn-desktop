# Automatic Ubiquity install of Linux Mint (Cinnamon) for the Wave desktop lab.
# labctl fills @USER@, @HOSTNAME@, @CRYPTED@ (SHA-512 crypt of the private
# password) and @SSHKEY@ (public lab key), appends the result to the live initrd
# for one install and deletes it afterwards. Never commit a filled copy.

d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string

# "Erase disk and install Linux Mint" on the only disk, the installer's default layout.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

d-i passwd/user-fullname string Wave Lab
d-i passwd/username string @USER@
d-i passwd/user-password-crypted password @CRYPTED@
d-i passwd/auto-login boolean true
d-i user-setup/encrypt-home boolean false
d-i user-setup/allow-password-weak boolean true

# Mint's "Install multimedia codecs" box stays unticked (installer default).
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/summary note
ubiquity ubiquity/reboot boolean false
ubiquity ubiquity/poweroff boolean true

# Lab access only: SSH key login, guest agent, passwordless sudo (documented deviations).
# The chroot shares the live system's network namespace, so its resolved stub answers DNS.
ubiquity ubiquity/success_command string \
    mkdir -p /target/run/systemd/resolve; \
    echo 'nameserver 127.0.0.53' > /target/run/systemd/resolve/stub-resolv.conf; \
    in-target apt-get update; \
    in-target env DEBIAN_FRONTEND=noninteractive apt-get -y install openssh-server qemu-guest-agent; \
    install -d -m 700 /target/home/@USER@/.ssh; \
    echo '@SSHKEY@' > /target/home/@USER@/.ssh/authorized_keys; \
    chmod 600 /target/home/@USER@/.ssh/authorized_keys; \
    in-target chown -R @USER@:@USER@ /home/@USER@/.ssh; \
    echo '@USER@ ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-wave-lab; \
    chmod 440 /target/etc/sudoers.d/90-wave-lab
